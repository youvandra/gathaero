<!doctype html><html><head><meta charset="utf-8">

<style>
html,body{margin:0}
body{width:1280px;height:400px;overflow:hidden;background:#fbf6ee;font-family:Archivo,sans-serif;color:#1f1416;position:relative}
.arc{position:absolute;inset:0}
.wrap{position:absolute;left:96px;top:0;bottom:0;display:flex;align-items:center;gap:40px}
.mark{width:168px;height:168px;filter:drop-shadow(0 18px 30px rgba(140,19,32,.25))}
h1{margin:0;font-size:92px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tag{margin:14px 0 0;font-size:32px;font-weight:700;color:#8c1320;letter-spacing:-.01em}
.sub{margin:18px 0 0;font-family:'IBM Plex Mono',monospace;font-size:17px;color:#6b5a5c;letter-spacing:.02em}
.board{position:absolute;right:72px;top:72px;width:360px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(31,20,22,.10);border:1px solid #eadfd3;overflow:hidden}
.board .h{background:#8c1320;color:#fff6e0;font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:12px 18px}
.row{display:grid;grid-template-columns:72px 84px 1fr;justify-items:start;align-items:center;padding:13px 18px;border-top:1px solid #f1e8de;font-family:'IBM Plex Mono',monospace;font-size:15px}
.row b{font-family:Archivo;font-size:17px}
.pill{justify-self:end;white-space:nowrap;font-family:Archivo;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
.ok{background:#e4f3ea;color:#1f6f43}.late{background:#fbe3e6;color:#8c1320}.open{background:#f3ece2;color:#6b5a5c}
